name: checkwindows

on:
  push:
  workflow_dispatch:
    inputs:
      name:
        description: 'HwGui Windows'
        default: 'checkonly'
        required: true

jobs:
  Build:
    runs-on: windows-latest
    steps:

    # 1. Puxa os arquivos da sua HwguiSVN direto para o workspace da máquina virtual
    - name: Checkout do seu repositorio
      uses: actions/checkout@v4

    # 2. Configura e ativa o ambiente MinGW de 32 bits que já vem pré-instalado no GitHub
    - name: Configurar ambiente MSYS2 / MinGW 32-bits
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        update: false # Falso para usar o compilador que já está na imagem sem perder tempo atualizando
        install: git

    # 3. Baixa e Compila o Harbour Core em 32-bits dentro do ambiente isolado do Windows
    - name: Baixar e Compilar Harbour Core (32-bits)
      shell: msys2 {0}
      run: |
        git clone https://github.com/harbour/core.git /tmp/harbour --depth 1
        cd /tmp/harbour
        # win-make gera os binários nativos do Harbour para Windows
         mingw32-make -j %NUMBER_OF_PROCESSORS% install HB_INSTALL_PREFIX=C:/temp/harbour

    # 4. Compila as bibliotecas da sua HWGUI
    - name: Build 32 bits - HWGUI
      shell: msys2 {0}
      env:
         HB_BUILD_STRIP: all
         HB_COMPILER: mingw
         HB_INSTALL_PREFIX: C:/temp/harbour
      run: |
        # Adiciona o Harbour recém-criado no PATH de execução do terminal
        export PATH="/c/temp/harbour/bin:$PATH"

        # Executa a compilação dos seus arquivos .hbp na raiz do repositório
        hbmk2 hwgui.hbp -w3
        hbmk2 hbxml.hbp -w3
        hbmk2 procmisc.hbp -w3
        hbmk2 hwgdebug.hbp -w3

