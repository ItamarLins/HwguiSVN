name: checkwindows

on:
  push:
  workflow_dispatch:

jobs:
  Build:
    runs-on: windows-latest
    steps:

    - uses: actions/checkout@v4

    - name: Configurar MSYS2 / MinGW 64-bits
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          make
          mingw-w64-x86_64-gcc

    - name: Baixar Harbour pre-compilado
      shell: pwsh
      run: |
        # Troque a URL pela do seu Release.
        $url = "https://github.com/ItamarLins/hwguiSVN/releases/download/harbour-mingw64-v1/harbour-mingw64.zip"
        Invoke-WebRequest -Uri $url -OutFile harbour.zip
        Expand-Archive -Path harbour.zip -DestinationPath C:\temp -Force

    - name: Verificar Harbour
      shell: msys2 {0}
      run: |
        ls -la /c/temp/harbour/bin/
        /c/temp/harbour/bin/harbour.exe --version
        file /c/temp/harbour/bin/harbour.exe

    - name: Build 64 bits - HWGUI
      shell: msys2 {0}
      env:
        HB_BUILD_STRIP: all
        HB_COMPILER: mingw64
        HB_INSTALL_PREFIX: /c/temp/harbour
      run: |
        set -e
        export PATH="/c/temp/harbour/bin:$PATH"
        cd "$GITHUB_WORKSPACE"
        hbmk2 hwgui.hbp -w3
        hbmk2 hbxml.hbp -w3
        hbmk2 procmisc.hbp -w3
        hbmk2 hwgdebug.hbp -w3

    - name: Upload artefatos
      uses: actions/upload-artifact@v4
      with:
        name: hwgui-mingw64
        path: |
          ${{ github.workspace }}/lib/*.a
          ${{ github.workspace }}/lib/*.lib
          ${{ github.workspace }}/include/*.ch
