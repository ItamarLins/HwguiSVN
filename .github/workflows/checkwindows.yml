name: checkwindows

on:
  push:
  workflow_dispatch:

jobs:
  Build:
    runs-on: windows-latest
    steps:

    - uses: actions/checkout@v4

    - name: Configurar MSYS2 / MinGW 64-bits
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          make
          mingw-w64-x86_64-gcc

    # 1. VERIFICAÇÃO DE CACHE: Se a pasta já foi guardada em um teste anterior, recupera ela intacta
    - name: Verificar Cache do Harbour Pre-compilado
      id: cache-harbour-win
      uses: actions/cache@v4
      with:
        path: C:\temp\harbour
        key: ${{ runner.os }}-harbour-mingw64-v1

    # 2. DOWNLOAD CONDICIONAL: Só executa se o passo de cache acima der um "cache-hit" falso
    - name: Baixar Harbour pre-compilado (Apenas se nao existir no cache)
      if: steps.cache-harbour-win.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $url = "https://github.com/ItamarLins/HwguiSVN/releases/download/harbour-mingw64-v1/harbour-mingw64.zip"
        $zipPath = "$env:TEMP\harbour.zip"

        # Garante que o diretório base C:\temp existe antes da extração
        if (!(Test-Path "C:\temp")) { New-Item -ItemType Directory -Path "C:\temp" | Out-Null }

        Write-Host "Baixando o Harbour de: $url"
        Invoke-WebRequest -Uri $url -OutFile $zipPath

        Write-Host "Extraindo os binarios..."
        Expand-Archive -Path $zipPath -DestinationPath C:\temp -Force
        Remove-Item -Path $zipPath -Force

    - name: Verificar Harbour
      shell: msys2 {0}
      run: |
        ls -la /c/temp/harbour/bin/
        /c/temp/harbour/bin/harbour.exe --version
        file /c/temp/harbour/bin/harbour.exe

    - name: Build 64 bits - HWGUI
      shell: msys2 {0}
      env:
        HB_BUILD_STRIP: all
        HB_COMPILER: mingw64
        HB_INSTALL_PREFIX: 'C:\temp\harbour'
      run: |
        set -e
        export PATH="/c/temp/harbour/bin:/mingw64/bin:$PATH"
        cd "$GITHUB_WORKSPACE"
        hbmk2 hwgui.hbp -w3
        hbmk2 hbxml.hbp -w3
        hbmk2 procmisc.hbp -w3
        hbmk2 hwgdebug.hbp -w3

    - name: Upload artefatos
      uses: actions/upload-artifact@v4
      with:
        name: hwgui-mingw64
        path: |
          ${{ github.workspace }}/lib/*.a
          ${{ github.workspace }}/lib/*.lib
          ${{ github.workspace }}/include/*.ch
